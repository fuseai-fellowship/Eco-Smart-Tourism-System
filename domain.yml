version: "3.1"

# ----------------------
# Intents
# ----------------------
intents:
  - greet
  - plan_trip          # BERT intent for itinerary planning
  - ask_budget         # extra intent from your model
  - ask_places         # intent for listing attractions
  - goodbye
  - fallback           # for unknown/unhandled inputs

# ----------------------
# Entities
# ----------------------
entities:
  - DESTINATION

# ----------------------
# Slots
# ----------------------
slots:
  destination:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: DESTINATION

# ----------------------
# Responses
# ----------------------
responses:
  utter_greet:
    - text: "Namaste! Welcome to the Smart Itinerary Planner! 🌏 Where would you like to travel?"

  utter_goodbye:
    - text: "Have a safe and happy journey! Goodbye! 👋"

  utter_ask_destination:
    - text: "Please tell me your destination so I can plan your itinerary."

  utter_no_data:
    - text: "Sorry, I don't have data for that location yet. 🗺️"

  utter_ask_budget:
    - text: "What is your preferred budget range for this trip?"

  utter_default:
    - text: "Sorry, I didn’t understand that. Could you rephrase?"

# ----------------------
# Actions
# ----------------------
actions:
  - action_generate_itinerary
  - utter_greet
  - utter_goodbye
  - utter_ask_destination
  - utter_no_data
  - utter_ask_budget
  - utter_default
