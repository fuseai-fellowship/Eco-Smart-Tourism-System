version: "3.1"

rules:

# ----------------------
# GREETING
# ----------------------
- rule: Greet user
  steps:
  - intent: greet
  - action: utter_greet

# ----------------------
# GENERATE ITINERARY / TRAVEL PLAN
# ----------------------
- rule: Generate itinerary
  steps:
  - intent: plan_trip
  - action: action_generate_itinerary

# ----------------------
# ASK PLACES
# ----------------------
- rule: Ask for places
  steps:
  - intent: ask_places
  - action: action_generate_itinerary

# ----------------------
# ASK BUDGET
# ----------------------
- rule: Ask for budget
  steps:
  - intent: ask_budget
  - action: action_generate_itinerary

# ----------------------
# GOODBYE
# ----------------------
- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

# ----------------------
# FALLBACK HANDLER
# ----------------------
- rule: Handle fallback
  steps:
  - intent: fallback
  - action: utter_default
