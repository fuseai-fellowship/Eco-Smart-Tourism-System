version: "3.1"

nlu:
# --------------------
# General Chit-Chat
# --------------------
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - hello there
    - good morning
    - good evening
    - namaste
    - namaskar
    - jai Nepal
    - subha din
    - subha sandhya

- intent: goodbye
  examples: |
    - cu
    - good bye
    - cee you later
    - good night
    - bye
    - goodbye
    - see you later
    - dhanyabad
    - pheri bhetaula

- intent: affirm
  examples: |
    - yes
    - y
    - ho
    - thik cha
    - correct
    - of course
    - indeed

- intent: deny
  examples: |
    - no
    - n
    - hoina
    - never
    - not really
    - I don't think so
    - no way

- intent: bot_challenge
  examples: |
    - are you a bot?
    - are you a human?
    - am I talking to a bot?
    - am I talking to a human?

# --------------------
# Tourism / Itinerary Intents
# --------------------
- intent: destination_query
  examples: |
    - Tell me about [Kathmandu](destination)
    - What can I do in [Pokhara](destination)?
    - Show me places to visit in [Chitwan](destination)
    - I want to go to [Lumbini](destination)
    - Attractions in [Everest Base Camp](destination)
    - Things to see in [Annapurna](destination)
    - What should I explore in [Bhaktapur](destination)?
    - Recommend destinations in [Province 3](province)
    - Tourist spots in [Janakpur](destination)
    - Hidden gems in [Mustang](destination)

- intent: activity_preference
  examples: |
    - I want an [adventure](activity_type) trip in Nepal
    - Show me [cultural](activity_type) sites in Nepal
    - I want to see [wildlife](activity_type)
    - I like [trekking](activity_type) in the Himalayas
    - I want [historical](activity_type) places
    - Best [sightseeing](activity_type) spots in Nepal
    - Give me a trip focused on [adventure](activity_type) and [sightseeing](activity_type)
    - I want to experience [religious](activity_type) sites like Pashupatinath
    - I want [pilgrimage](activity_type) destinations like Lumbini

- intent: best_time_query
  examples: |
    - Best time to visit [Everest Base Camp](destination)
    - When should I go to [Lumbini](destination)?
    - Optimal season for trekking in [Annapurna](destination)
    - When is the best month to visit [Chitwan](destination)?
    - Best season for visiting [Pokhara](destination)
    - When is [Dashain](festival) celebrated?

- intent: duration_query
  examples: |
    - How many days should I spend in [Pokhara](destination)?
    - Duration for visiting [Chitwan National Park](destination)
    - Trip length for [Annapurna Circuit](destination)
    - Suggest a [3 days](duration) itinerary in Nepal
    - Short weekend trips in Nepal
    - I have [7 days](duration) for Nepal travel

- intent: recommendation_request
  examples: |
    - Recommend me a [5-day](duration) itinerary in Nepal
    - I want a trip with [sightseeing](activity_type) and [adventure](activity_type)
    - Plan a [3-day](duration) trip for me
    - Give me a weekend trip suggestion in Nepal
    - Suggest popular destinations for [culture](activity_type) and [history](activity_type)
    - I want a trekking itinerary in [Himalayas](location)
    - Suggest a wildlife safari in [Chitwan](destination)

- intent: category_query
  examples: |
    - Show me [Popular](category) destinations
    - I want [Off-Beat](category) places to visit in Nepal
    - List [Off-Beat](category) attractions in [Province 2](province)
    - What are the [Popular](category) tourist spots in [Province 3](province)?
    - Hidden gems for [adventure](activity_type) seekers

# --------------------
# Mood / Chit-Chat (for empathy)
# --------------------
- intent: mood_great
  examples: |
    - perfect
    - great
    - amazing
    - feeling like a king
    - wonderful
    - I am feeling very good
    - I am great
    - I am amazing
    - I am going to save the world
    - super stoked
    - extremely good
    - so so perfect
    - so good
    - so perfect

- intent: mood_unhappy
  examples: |
    - my day was horrible
    - I am sad
    - I don't feel very well
    - I am disappointed
    - super sad
    - I'm so sad
    - sad
    - very sad
    - unhappy
    - not good
    - not very good
    - extremly sad
    - so saad
    - so sad

