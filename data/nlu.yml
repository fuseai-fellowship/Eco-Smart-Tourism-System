version: "3.1"

nlu:
# ----------------------
# GREETING
# ----------------------
- intent: greet
  examples: |
    - hi
    - hello
    - namaste
    - hey
    - good morning
    - good evening

# ----------------------
# PLAN TRIP / ITINERARY
# ----------------------
- intent: plan_trip
  examples: |
    - plan a 3-day itinerary for Pokhara
    - create a travel plan for Chitwan
    - suggest an itinerary for Dolakha
    - what can I do in Kathmandu for two days?
    - I want to visit Pokhara next week
    - plan a visit to Pokhara
    - 3 day itinerary for Kathmandu cultural sites
    - show itinerary for Lumbini
    - prepare my trip plan for Bhaktapur

# ----------------------
# ASK PLACES / ATTRACTIONS
# ----------------------
- intent: ask_places
  examples: |
    - what are the best places to visit in Pokhara?
    - list some attractions in Chitwan
    - things to do in Dolakha
    - show me popular sites in Kathmandu
    - give me sightseeing options in Nepal

# ----------------------
# ASK BUDGET / EXPENSES
# ----------------------
- intent: ask_budget
  examples: |
    - how much will it cost for a 3-day trip to Pokhara?
    - give me a budget estimate for Kathmandu tour
    - what is the expense for Dolakha trip?
    - trip budget for Lumbini
    - estimate cost for Pokhara visit

# ----------------------
# GOODBYE
# ----------------------
- intent: goodbye
  examples: |
    - bye
    - thank you
    - see you later
    - thanks
    - goodbye

# ----------------------
# FALLBACK / UNKNOWN INPUTS
# ----------------------
- intent: fallback
  examples: |
    - I don't know
    - something else
    - random text
    - asdfgh
    - what???
