language: "en"
recipe: default.v1

# ----------------------
# NLU Pipeline
# ----------------------
pipeline:
  # ✅ Custom component first (runs BERT + spaCy)
  - name: custom_components.custom_nlp_component.CustomNLPComponent

  # ✅ Basic tokenization and featurization for Rasa’s internal use
  - name: WhitespaceTokenizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # ✅ Lightweight DIET classifier (optional backup to your BERT)
  - name: DIETClassifier
    epochs: 5
    constrain_similarities: true

  # ✅ Entity Synonyms and Regex if needed
  - name: EntitySynonymMapper
  - name: RegexEntityExtractor

# ----------------------
# Dialogue Management Policies
# ----------------------
policies:
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true

  - name: MemoizationPolicy
    max_history: 5

  - name: TEDPolicy
    max_history: 5
    epochs: 10
    constrain_similarities: true

# ----------------------
# Optional Assistant Metadata
# ----------------------
assistant_id: "20251029-112850-freezing-clutch"
